# Arzio Mail on one server with Docker.
#   cp .env.example deploy/.env   (fill it in)
#   docker compose -f deploy/docker-compose.yml up -d --build
# See docs/DEPLOY.md for DNS, certificates and first sign-in.
services:
  arzio:
    build: ..
    image: arzio-mail:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ARZIO_DATA_DIR: /data
      PORT: "3000"
      INBOUND_SMTP_PORT: "2525"
      IMAP_PORT: "1993"
      SUBMISSION_PORT: "1465"
      TRUST_PROXY: "true"
      SECURE_COOKIES: "true"
      INBOUND_TLS_KEY: /certs/privkey.pem
      INBOUND_TLS_CERT: /certs/fullchain.pem
      MAIL_TLS_KEY: /certs/privkey.pem
      MAIL_TLS_CERT: /certs/fullchain.pem
    volumes:
      - arzio-data:/data
      - /opt/arzio/backups:/backups
      - /opt/arzio/certs:/certs:ro
    ports:
      - "25:2525"      # inbound mail from the internet (MX)
      - "993:1993"     # IMAP over TLS for mail apps
      - "465:1465"     # SMTP submission over TLS for mail apps
      - "127.0.0.1:3000:3000"   # web, only through nginx
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [arzio]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/arzio.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    environment:
      ARZIO_UPSTREAM: arzio:3000

  # Optional: PostgreSQL instead of SQLite. Start with
  #   docker compose -f deploy/docker-compose.yml --profile postgres up -d
  # and set ARZIO_DB_URL=postgres://arzio:${POSTGRES_PASSWORD}@postgres:5432/arzio in deploy/.env
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: arzio
      POSTGRES_DB: arzio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    volumes:
      - arzio-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arzio"]
      interval: 10s

volumes:
  arzio-data:
  arzio-pg:
