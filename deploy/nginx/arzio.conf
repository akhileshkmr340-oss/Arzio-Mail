# nginx in front of Arzio Mail: HTTPS for the web app, API, CalDAV/CardDAV and MCP.
# Replace mail.arzio.com with your host name.
# With Docker Compose the upstream is arzio:3000. With systemd use 127.0.0.1:3000.
upstream arzio {
    server arzio:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name mail.arzio.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.arzio.com;

    ssl_certificate     /etc/letsencrypt/live/mail.arzio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.arzio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Messages with attachments are sent as JSON (base64), so allow ~1.4x the max message size
    client_max_body_size 40m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;

    # Metrics are for your monitoring only
    location = /metrics { allow 127.0.0.1; deny all; proxy_pass http://arzio; }

    # AI agents (MCP): no buffering so responses stream
    location /mcp { proxy_buffering off; proxy_pass http://arzio; }

    # CalDAV / CardDAV discovery and sync (PROPFIND, REPORT, PUT, DELETE pass through)
    location /.well-known/ { proxy_pass http://arzio; }
    location /dav/ { proxy_pass http://arzio; }

    location / { proxy_pass http://arzio; }
}
